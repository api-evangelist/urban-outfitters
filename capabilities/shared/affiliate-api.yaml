name: Urban Outfitters Affiliate API
description: >-
  Shared capability definition for the Urban Outfitters affiliate program API
  managed through Rakuten Advertising. Covers product catalog search, affiliate
  link generation, commission reporting, and creative asset retrieval.
version: '1.0.0'
baseUrl: https://api.rakutenadvertising.com
mcp:
  port: 9110
rest:
  port: 8110
operations:
  - operationId: searchProducts
    name: Search Products
    description: Search the Urban Outfitters product catalog for affiliate promotion
    method: GET
    path: /v1/products
    parameters:
      - name: q
        in: query
        description: Search query string
        schema:
          type: string
      - name: category
        in: query
        description: Product category filter
        schema:
          type: string
          enum: [womens, mens, home, accessories, beauty]
      - name: limit
        in: query
        schema:
          type: integer
          default: 20
      - name: offset
        in: query
        schema:
          type: integer
          default: 0
    responses:
      - status: 200
        description: Product search results with affiliate URLs

  - operationId: getProduct
    name: Get Product Details
    description: Retrieve detailed product info including affiliate deep link
    method: GET
    path: /v1/products/{product_id}
    parameters:
      - name: product_id
        in: path
        required: true
        schema:
          type: string
    responses:
      - status: 200
        description: Product details with affiliate URL
      - status: 404
        description: Product not found

  - operationId: createAffiliateLink
    name: Create Affiliate Link
    description: Generate an affiliate tracking link for a product or page URL
    method: POST
    path: /v1/links
    requestBody:
      required: true
      schema:
        type: object
        required: [targetUrl, affiliateId]
        properties:
          targetUrl:
            type: string
          affiliateId:
            type: string
    responses:
      - status: 200
        description: Generated affiliate tracking link

  - operationId: getCommissionReport
    name: Get Commission Report
    description: Retrieve commission earnings and performance metrics
    method: GET
    path: /v1/reports/commissions
    parameters:
      - name: start_date
        in: query
        schema:
          type: string
          format: date
      - name: end_date
        in: query
        schema:
          type: string
          format: date
      - name: affiliate_id
        in: query
        schema:
          type: string
    responses:
      - status: 200
        description: Commission earnings report

  - operationId: listCreatives
    name: List Creative Assets
    description: Retrieve available banner ads and creative assets
    method: GET
    path: /v1/creatives
    parameters:
      - name: size
        in: query
        description: Banner size filter
        schema:
          type: string
          enum: ['300x250', '728x90', '160x600', '300x600']
    responses:
      - status: 200
        description: List of banner ads and creative assets
